name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  Build:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v5

      # 设置 JDK
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Get Tag
        id: var
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # 创建 local.properties 文件（未配置 Secrets 时使用占位值，仅保证编译通过）
      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY != '' && secrets.MAPS_API_KEY || 'gogogo-build-check' }}
          MAPS_SAFE_CODE=${{ secrets.MAPS_SAFE_CODE != '' && secrets.MAPS_SAFE_CODE || 'gogogo-build-check' }}
          EOF

      # 构建 APK（release 变体已配置使用仓库内 keystore/GoGoGo.jks 签名）
      - name: Build APK
        run: bash ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Release-APK
          path: app/build/outputs/apk/release/*.apk

      # https://github.com/marketplace/actions/auto-changelog
      # require commit format are "type(category): description [flag]"
      # 仅在 tag 触发时生成（手动触发时 ref 为分支名，auto-changelog 无法解析为 semver）
      - name: Make Changelog
        if: startsWith(github.ref, 'refs/tags/')
        uses: ardalanamini/auto-changelog@v4.0.4
        id  : changelog
        with:
          github-token            : ${{ github.token }}
          commit-types            : |
            feat: New Features
            fix: Bug Fixes
            build: Build System & Dependencies
            perf: Performance Improvements
            docs: Documentation
            test: Tests
            refactor: Refactors
            chore: Chores
            ci: CI
            style: Code Style
            revert: Reverts
          default-commit-type     : Other Changes
          mention-authors         : true
          mention-new-contributors: true
          include-compare-link    : true

      - name: Upload Changelog
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Changelog
          path: ${{ steps.changelog.outputs.changelog }}

      # https://github.com/marketplace/actions/gh-release
      - name: Release APK
        uses: softprops/action-gh-release@v2.3.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ github.token }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
